name: Build installers

# Builds native installers for Windows, macOS and Linux (each must be built on its own OS).
# This workflow runs from a pull request only. Do not build installers locally; download the
# artifacts from the PR's Actions run instead.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: installers-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pwsh -File packaging/windows/build.ps1
            artifact: installers-Windows
            arch: ""
          - os: macos-latest
            script: bash packaging/macos/build.sh
            artifact: installers-macOS
            arch: arm64
          - os: macos-latest
            script: bash packaging/macos/build.sh
            artifact: installers-macOS-Intel
            arch: x86_64
          - os: ubuntu-24.04
            script: bash packaging/linux/build.sh
            artifact: installers-Linux
            arch: ""
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Flet CLI
        run: pip install -e ".[desktop]"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang cmake ninja-build pkg-config llvm lld libgtk-3-dev \
            libsecret-1-0 libsecret-1-dev libunwind-dev libasound2-dev libmpv-dev mpv \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"   # run appimagetool without FUSE

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/installer/*
          if-no-files-found: error

